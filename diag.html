<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>확인용</title>
<style>body{font-family:sans-serif;background:#fff;color:#111;padding:24px;font-size:22px;line-height:1.6}h1{font-size:28px}.k{font-weight:700}.box{border:2px solid #888;padding:12px;margin:10px 0;word-break:break-all}</style></head>
<body><h1>확인용 화면 — 이 화면을 찍어서 보내 주세요</h1>
<div class="box"><span class="k">1. 다크 신호:</span> <span id="a"></span></div>
<div class="box"><span class="k">2. 밝게 신호:</span> <span id="b"></span></div>
<div class="box"><span class="k">3. 자동 어둡게 감지:</span> <span id="c"></span></div>
<div class="box"><span class="k">4. 강제 색:</span> <span id="d"></span></div>
<div class="box"><span class="k">5. 브라우저:</span> <span id="e"></span></div>
<div class="box"><span class="k">6. 기본 글자색/바탕색:</span> <span id="f"></span></div>
<script>
var mm=function(q){try{return matchMedia(q).matches?'예':'아니오'}catch(e){return '오류'}};
document.getElementById('a').textContent=mm('(prefers-color-scheme: dark)');
document.getElementById('b').textContent=mm('(prefers-color-scheme: light)');
var el=document.createElement('div');el.style.cssText='display:none;background-color:canvas;color-scheme:light';document.body.appendChild(el);
document.getElementById('c').textContent=getComputedStyle(el).backgroundColor;
document.getElementById('d').textContent=mm('(forced-colors: active)')+' / 반전 '+mm('(inverted-colors: inverted)')+' / 대비 '+mm('(prefers-contrast: more)');
document.getElementById('e').textContent=navigator.userAgent;
var t=document.createElement('div');t.style.cssText='color:canvastext;background-color:canvas';document.body.appendChild(t);
document.getElementById('f').textContent=getComputedStyle(t).color+' / '+getComputedStyle(t).backgroundColor+' / body '+getComputedStyle(document.body).backgroundColor;
</script></body></html>
